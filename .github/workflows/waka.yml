name: Waka Readme

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   
          # Optional: Set the timezone for WakaTime data (default is UTC)
          # TIMEZONE: "America/New_York"
          # Optional: Set the number of days to include in the WakaTime data (default is 7)
          # DAYS: 7
          # Optional: Set the filename for the generated README (default is README.md)
          # FILENAME: "README.md" 